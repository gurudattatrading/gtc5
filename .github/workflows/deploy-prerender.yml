name: Deploy Prerender.io Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required GitHub Actions secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRERENDER_TOKEN: ${{ secrets.PRERENDER_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret first." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret first." && exit 1)
          test -n "$PRERENDER_TOKEN" || (echo "::error::Add the PRERENDER_TOKEN repository secret first." && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Add Prerender token as a Worker secret
        env:
          PRERENDER_TOKEN: ${{ secrets.PRERENDER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$PRERENDER_TOKEN" | npx --yes wrangler@4 secret put PRERENDER_TOKEN --config wrangler.toml
